[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["webcompat_kb"]

[project]
name = "webcompat-kb"
description = "Import webcompat data into BigQuery"
authors = [
  {name = "Mozilla Corporation"}
]
version = "0.1.0"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
license = "MPL-2.0"
dependencies = [
  "bugdantic==0.4.3",
  "filetype==1.2.0",
  "google-cloud-bigquery==3.43.0",
  "html5lib==1.1",
  "httpx[http2]>=0.28.1",
  "jinja2>=3.1.6",
  "pydantic==2.13.4",
  "tomli-w>=1.2.0",
  "web-features==3.1.0",
  "zstandard>=0.25.0",
]

[project.optional-dependencies]
test = [
  "mypy==2.3.0",
  "ty==0.0.71",
  "pandas-stubs==3.0.5.260730",
  "pytest-ruff==0.5",
  "pytest==9.1.1",
  "ruff==0.16.3",
  "types-html5lib==1.1.11.20250917",
  "types-cachetools==7.0.0.20260713",
  "types-cffi==2.0.0.20260518",
  "types-protobuf==7.34.1.20260518",
  "types-pyOpenSSL==24.1.0.20240722",
  "types-python-dateutil==2.9.0.20260807",
  "types-pytz==2026.3.1.20260727",
  "types-requests==2.33.0.20260712",
  "types-setuptools==84.0.0.20260812",
  "types-tqdm==4.70.0.20260805",
]

[project.scripts]
webcompat-etl = "webcompat_kb.main:main"
webcompat-add-metric = "webcompat_kb.commands.add_metric:main"
webcompat-backfill-history = "webcompat_kb.utils:backfill_history"
webcompat-backfill-metric = "webcompat_kb.commands.backfill_metric:main"
webcompat-bug-score-changes = "webcompat_kb.commands.bug_score_changes:main"
webcompat-check-templates = "webcompat_kb.commands.checkdata:main"
webcompat-metric-rescore = "webcompat_kb.commands.metric_rescore:main"
webcompat-render = "webcompat_kb.commands.render:main"
webcompat-update-redash = "webcompat_kb.commands.update_redash:main"
webcompat-update-staging-data = "webcompat_kb.commands.update_staging_data:main"
webcompat-site-rank-update = "webcompat_kb.commands.site_rank_update:main"
webcompat-validate = "webcompat_kb.commands.validate:main"


[tool.pytest]
testpaths = ["tests"]

[tool.mypy]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["filetype"]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["UP045", "LOG015", "BLE001"]
